<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2400" role="img" aria-labelledby="title desc">
  <title id="title">Reliable AI automation editorial cover</title>
  <desc id="desc">A production AI workflow with evaluation, human review, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1737"/>
      <stop offset=".55" stop-color="#172f72"/>
      <stop offset="1" stop-color="#805bdd"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="28" stdDeviation="38" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="2400" height="2400" fill="url(#bg)"/>
  <g fill="none" stroke="#a7b8ff" stroke-opacity=".15">
    <circle cx="1920" cy="420" r="330"/><circle cx="1920" cy="420" r="510"/><circle cx="1920" cy="420" r="690"/>
  </g>
  <text x="140" y="170" fill="#e9edff" font-family="Arial, sans-serif" font-size="34" letter-spacing="8">CIRCLES JOURNAL / 03</text>
  <text x="140" y="650" fill="#e9edff" font-family="Georgia, serif" font-size="315" letter-spacing="-18">AI, READY</text>
  <text x="140" y="980" fill="#e9edff" font-family="Georgia, serif" font-size="315" letter-spacing="-18">FOR THE</text>
  <text x="140" y="1310" fill="#bfaeff" font-family="Georgia, serif" font-size="315" letter-spacing="-18">REAL WORLD.</text>
  <g transform="translate(140 1530)" filter="url(#shadow)">
    <g>
      <rect width="420" height="410" rx="30" fill="#edf0ff"/>
      <text x="42" y="75" fill="#172454" font-family="Arial" font-size="26" letter-spacing="3">01 / MAP</text>
      <text x="42" y="178" fill="#172454" font-family="Arial" font-size="52">Bounded</text>
      <text x="42" y="240" fill="#172454" font-family="Arial" font-size="52">task</text>
      <circle cx="340" cy="330" r="38" fill="#775bd1"/>
    </g>
    <g transform="translate(485)">
      <rect width="420" height="410" rx="30" fill="#cbd4ff"/>
      <text x="42" y="75" fill="#172454" font-family="Arial" font-size="26" letter-spacing="3">02 / MEASURE</text>
      <text x="42" y="178" fill="#172454" font-family="Arial" font-size="52">Evaluation</text>
      <text x="42" y="240" fill="#172454" font-family="Arial" font-size="52">set</text>
      <circle cx="340" cy="330" r="38" fill="#425ec2"/>
    </g>
    <g transform="translate(970)">
      <rect width="420" height="410" rx="30" fill="#aebaf8"/>
