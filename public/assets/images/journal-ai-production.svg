      <text x="42" y="178" fill="#172454" font-family="Arial" font-size="52">Human</text>
      <text x="42" y="240" fill="#172454" font-family="Arial" font-size="52">oversight</text>
      <circle cx="340" cy="330" r="38" fill="#3149a7"/>
