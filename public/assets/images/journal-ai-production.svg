      <text x="42" y="178" fill="#fff" font-family="Arial" font-size="52">Observable</text>
      <text x="42" y="240" fill="#fff" font-family="Arial" font-size="52">and reversible</text>
      <path d="M42 330H485" stroke="#8c73e4" stroke-width="10"/>
      <circle cx="485" cy="330" r="24" fill="#bca9ff"/>
